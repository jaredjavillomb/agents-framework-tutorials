<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="820" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">Strands Agents: model-driven; the model plans, the agent loop runs the tools</text>
  <g font-size="13" fill="#0f172a">
    <rect x="20" y="70" width="190" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="115" y="96" text-anchor="middle" font-weight="bold">Agent(</text><text x="115" y="114" text-anchor="middle">model, system_prompt,</text><text x="115" y="131" text-anchor="middle">tools )</text>
    <rect x="300" y="60" width="200" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="84" text-anchor="middle" font-weight="bold">model call</text><text x="400" y="103" text-anchor="middle" font-size="11">decides: answer, or ask for a tool</text>
    <rect x="300" y="190" width="200" height="56" rx="8" fill="#ffedd5" stroke="#ea580c"/><text x="400" y="214" text-anchor="middle" font-weight="bold">tool call</text><text x="400" y="233" text-anchor="middle" font-size="11">@tool functions; results go back</text>
    <path d="M500,92 C580,110 580,200 504,214" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M300,218 C220,200 220,110 296,92" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="586" y="156" font-size="11" fill="#475569">asks for a tool</text><text x="146" y="166" font-size="11" fill="#475569">result</text>
    <line x1="210" y1="104" x2="296" y2="94" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="620" y="60" width="180" height="56" rx="8" fill="#e2e8f0" stroke="#475569"/><text x="710" y="84" text-anchor="middle" font-weight="bold">reply</text><text x="710" y="103" text-anchor="middle" font-size="11">loop ends when the model answers</text>
    <line x1="500" y1="76" x2="616" y2="80" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <rect x="20" y="268" width="380" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/><text x="210" y="288" text-anchor="middle" font-weight="bold">hooks</text><text x="210" y="304" text-anchor="middle" font-size="11">run before and after each model or tool call: log, cap, cancel, interrupt</text>
    <rect x="420" y="268" width="380" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="610" y="288" text-anchor="middle" font-weight="bold">agent.messages</text><text x="610" y="304" text-anchor="middle" font-size="11">the conversation lives in the agent; sessions save it</text>
  </g>
</svg>
