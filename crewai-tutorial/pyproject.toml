[project]
name = "crewai-tutorial"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-contracts",
    "crewai",
    "ollama",  # for the local embedder behind CrewAI memory (crew_agents/memory.py)
    "ipykernel",
    "jupyter",
    "python-dotenv",
]

[tool.uv.sources]
agent-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crew_agents"]
