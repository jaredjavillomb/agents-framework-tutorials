<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="820" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#0f172a">LangGraph: you draw the graph; every step reads and updates one state</text>
  <rect x="20" y="48" width="780" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="410" y="73" font-size="13" text-anchor="middle" fill="#0f172a">shared state:  messages · triage · ...   (typed; every node reads it and returns the keys it changes)</text>
  <g font-size="13" fill="#0f172a">
    <ellipse cx="70" cy="170" rx="44" ry="22" fill="#e2e8f0" stroke="#475569"/><text x="70" y="175" text-anchor="middle">START</text>
    <rect x="150" y="142" width="170" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="235" y="164" text-anchor="middle" font-weight="bold">triage</text><text x="235" y="184" text-anchor="middle" font-size="11">a node: code or a model call</text>
    <rect x="390" y="104" width="150" height="48" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="465" y="125" text-anchor="middle" font-weight="bold">decline</text><text x="465" y="143" text-anchor="middle" font-size="11">fixed reply, no model</text>
    <rect x="390" y="190" width="150" height="48" rx="8" fill="#ffedd5" stroke="#ea580c"/><text x="465" y="211" text-anchor="middle" font-weight="bold">specialist</text><text x="465" y="229" text-anchor="middle" font-size="11">an agent loop as a subgraph</text>
    <ellipse cx="660" cy="170" rx="44" ry="22" fill="#e2e8f0" stroke="#475569"/><text x="660" y="175" text-anchor="middle">END</text>
    <line x1="114" y1="170" x2="146" y2="170" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M320,160 C350,150 360,130 386,128" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <path d="M320,182 C350,192 360,212 386,214" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="300" y="116" font-size="11" fill="#475569">out of scope</text><text x="306" y="236" font-size="11" fill="#475569">otherwise</text>
    <line x1="540" y1="128" x2="616" y2="162" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
    <line x1="540" y1="214" x2="616" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="410" y="270" font-size="11" text-anchor="middle" fill="#475569">dashed arrows are conditional edges: a function picks the next node</text>
  </g>
  <rect x="20" y="284" width="780" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="410" y="306" font-size="13" text-anchor="middle" fill="#0f172a">checkpointer: saves the state after every step, per conversation thread  →  memory, pause for a person, resume, replay</text>
</svg>
